name: Release

# Tag-driven: pushing v0.2.0 builds and publishes that version. The tag is the
# single source of truth for the version, so nothing has to be edited in the
# repo to cut a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  SIGN_IDENTITY: "Developer ID Application: Pavel Hrakovich (7NMK8Z4NF4)"

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are derived from the commits since the previous tag,
          # so the whole history and every tag have to be present.
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      # A tag that cannot pass its own tests is not a release.
      - name: Test
        run: swift test

      # An ephemeral keychain so the certificate never touches the runner's
      # login keychain. The runner is destroyed after the job either way.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key non-interactively; without this the
          # signing step hangs forever waiting for a permission dialog no one
          # can click on a headless runner.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm cert.p12
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build the signed universal disk image
        run: make dmg VERSION="${GITHUB_REF_NAME#v}" SIGN_IDENTITY="$SIGN_IDENTITY"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials ctrlgrp-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          make notarize VERSION="${GITHUB_REF_NAME#v}"

      - name: Verify the shipped binary
        run: |
          set -euo pipefail
          BIN=ctrlgrp.app/Contents/MacOS/ctrlgrp
          lipo -info "$BIN"
          # Fail loudly rather than shipping an Apple-silicon-only build to
          # someone on an Intel Mac.
          lipo -archs "$BIN" | grep -q x86_64
          lipo -archs "$BIN" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 ctrlgrp.app
          # Authority lines only appear at -dvv; -dv prints none and the grep
          # would fail on a correctly signed build.
          codesign -dvv ctrlgrp.app 2>&1 | grep -q "Authority=$SIGN_IDENTITY"

      - name: Assemble release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="ctrlgrp-${VERSION}.dmg"
          {
            scripts/release-notes.sh "$GITHUB_REF_NAME"
            printf '\n## Install\n\n'
            printf 'Open the disk image, drag ctrlgrp into Applications, launch it. Signed\n'
            printf 'with a Developer ID and notarized by Apple, so there is nothing to\n'
            printf 'bypass and no permission prompts to click through.\n\n'
            printf 'Universal binary, Apple silicon and Intel. Requires macOS 14 or newer.\n\n'
            printf '`shasum -a 256`\n\n```\n%s\n```\n' "$(shasum -a 256 "$DMG")"
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "ctrlgrp-${GITHUB_REF_NAME#v}.dmg"
